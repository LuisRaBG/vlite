<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedBuho vLite - Lectura de Actividad</title>

    <link rel="stylesheet" href="../../../../assets/css/style.css">
    <link rel="stylesheet" href="../../../../assets/css/actividad_detalle.css">
</head>
<body class="dashboard-body">
    <div class="dashboard-layout">
        <!-- Sidebar Inyectado por components.js -->
        <aside id="app-sidebar"></aside>

        <main class="main-content">
            <!-- Header Inyectado por components.js -->
            <header id="app-top-header"></header>

            <div class="content-body">
                <article class="activity-reading-card">
                    <div class="reading-header">
                        <span class="badge-tag-light">LECTURA & ACTIVIDAD</span>
                        <h1>Cargando lección...</h1>
                    </div>

                    <!-- El contenido de los párrafos se inyectará dinámicamente desde manifest.js -->
                    <div class="reading-body-text"></div>
                </article>
            </div>
        </main>
    </div>

    <!-- Scripts en Orden de Dependencia -->
    <script src="../../manifest.js"></script>  <!-- Datos del curso padre -->
    <script src="manifest.js"></script>       <!-- Datos propios de esta lección (LECCION_DATA) -->
    <script src="../../../../assets/js/storage.js"></script>
    <script src="../../../../assets/js/components.js"></script>
    <script src="../../../../assets/js/main.js"></script>
</body>
</html>
