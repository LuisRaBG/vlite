<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedBuho vLite - Vista Módulo</title>

    <!-- Hojas de estilo maestra y de detalle del tema -->
    <link rel="stylesheet" href="../../../assets/css/style.css">
    <link rel="stylesheet" href="../../../assets/css/tema_detalle.css">
</head>
<body class="dashboard-body">
    <!-- Contenedor Principal con Layout Estático -->
    <div class="dashboard-layout">
        
        <!-- Sidebar Izquierdo Componentizado (Inyectado por components.js) -->
        <aside id="app-sidebar"></aside>

        <!-- Área Central de Contenido -->
        <main class="main-content">
            <!-- Barra Superior (Top Header Inyectado por components.js) -->
            <header id="app-top-header"></header>

            <!-- Contenedor Interno de Contenido (Fondo Blanco + Scroll Vertical) -->
            <div class="content-body">
                
                <!-- Encabezado del Tema (Fondo Azul Claro) -->
                <header class="topic-hero-card">
                    <div class="topic-titles">
                        <span class="badge-tag-light" id="titulo-curso-padre">Cargando curso...</span>
                        <h1 id="titulo-tema">Cargando tema...</h1>
                        <p id="descripcion-tema" class="overview-desc">Cargando descripción del módulo...</p>
                    </div>
                    
                    <div class="topic-progress-circle">
                        <div class="circle-content">
                            <span class="circle-pct">35%</span>
                            <span class="circle-label">COMPLETO</span>
                        </div>
                    </div>
                </header>

                <!-- Subtítulo de Estructura -->
                <div class="section-title-bar">
                    <h2>Estructura de Lecciones</h2>
                </div>

                <!-- Lista de Lecciones Inyectadas por JS -->
                <main class="lessons-section">
                    <ul id="lista-enlaces" class="lessons-grid"></ul>
                </main>
            </div>
        </main>
    </div>

    <!-- Carga de manifiesto local, estado, componentes y motor principal -->
    <script src="../manifest.js"></script>
    <script src="../../../assets/js/storage.js"></script>
    <script src="../../../assets/js/components.js"></script>
    <script src="../../../assets/js/main.js"></script>
</body>
</html>
